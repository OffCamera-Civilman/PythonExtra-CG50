name: Build fx-CG50

on:
  push:
    branches:
      - cg50-new-display
    paths:
      - "ports/**"
      - "py/**"
      - "extmod/**"
      - "shared/**"
      - ".github/workflows/build-cg50.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl git python3 python3-pil build-essential cmake pkg-config \
            libusb-1.0-0-dev libsdl2-dev libpng-dev libncurses-dev

      - name: Prepare custom G3A icon
        shell: bash
        run: |
          set -euo pipefail

          # The logo was added to main after this compatibility branch was
          # created, so import that exact repository asset for the build.
          git fetch origin main --no-tags
          mkdir -p logo
          git show FETCH_HEAD:logo/logo.jpg > logo/logo.jpg

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          source = Path("logo/logo.jpg")
          out_dir = Path("ports/fxcg50")
          size = (92, 64)

          image = Image.open(source).convert("RGB")
          image = ImageOps.contain(image, size, Image.Resampling.LANCZOS)

          # Preserve the full logo instead of cropping it. Use the image's
          # corner color as the letterbox background so padding blends in.
          background = Image.new("RGB", size, image.getpixel((0, 0)))
          x = (size[0] - image.width) // 2
          y = (size[1] - image.height) // 2
          background.paste(image, (x, y))

          for name in (
              "icon-uns.png",
              "icon-sel.png",
              "icon-uns-dev.png",
              "icon-sel-dev.png",
          ):
              background.save(out_dir / name, "PNG")

          print(f"Prepared G3A icon from {source}: {size[0]}x{size[1]}")
          PY

      - name: Install GiteaPC
        shell: bash
        run: |
          set -euo pipefail
          curl "https://git.planet-casio.com/Lephenixnoir/GiteaPC/raw/branch/master/install.sh" \
            -o /tmp/giteapc-install.sh
          printf '\n' | bash /tmp/giteapc-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install fxSDK toolchain and libraries
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          giteapc install \
            Lephenixnoir/fxsdk:noudisks2 \
            Lephenixnoir/sh-elf-binutils \
            Lephenixnoir/sh-elf-gcc
          giteapc install Lephenixnoir/OpenLibm Vhex-Kernel-Core/fxlibc
          giteapc install Lephenixnoir/sh-elf-gcc
          giteapc install Lephenixnoir/gint Lephenixnoir/JustUI

      - name: Record dependency versions
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p build-info
          {
            echo "PythonExtra: $(git rev-parse HEAD)"
            echo "Upstream PythonExtra: $(cat UPSTREAM_COMMIT 2>/dev/null || echo unknown)"
            echo "gint: $(git -C "$(giteapc show -p Lephenixnoir/gint)" rev-parse HEAD)"
            echo "fxSDK: $(git -C "$(giteapc show -p Lephenixnoir/fxsdk)" rev-parse HEAD)"
            echo "JustUI: $(git -C "$(giteapc show -p Lephenixnoir/JustUI)" rev-parse HEAD)"
          } | tee build-info/versions.txt

      - name: Build PythonExtra for fx-CG50
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          make -C ports/fxcg50 -j2

      - name: Upload G3A
        uses: actions/upload-artifact@v4
        with:
          name: PythonExtra-CG50
          path: |
            ports/fxcg50/PythonExtra.g3a
            build-info/versions.txt
          if-no-files-found: error
