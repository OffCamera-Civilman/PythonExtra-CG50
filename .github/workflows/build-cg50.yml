name: Build fx-CG50

on:
  push:
    branches:
      - cg50-new-display
    paths:
      - "ports/**"
      - "py/**"
      - "extmod/**"
      - "shared/**"
      - ".github/workflows/build-cg50.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl git python3 python3-pil build-essential cmake pkg-config \
            libusb-1.0-0-dev libsdl2-dev libpng-dev libncurses-dev

      - name: Prepare custom G3A icon
        shell: bash
        run: |
          set -euo pipefail

          # The logo was added to main after this compatibility branch was
          # created, so import that exact repository asset for the build.
          git fetch origin main --no-tags
          mkdir -p logo
          git show FETCH_HEAD:logo/logo.jpg > logo/logo.jpg

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          source = Path("logo/logo.jpg")
          out_dir = Path("ports/fxcg50")
          size = (92, 64)

          image = Image.open(source).convert("RGB")
          image = ImageOps.contain(image, size, Image.Resampling.LANCZOS)

          # Preserve the full logo instead of cropping it. Use the image's
          # corner color as the letterbox background so padding blends in.
          background = Image.new("RGB", size, image.getpixel((0, 0)))
          x = (size[0] - image.width) // 2
          y = (size[1] - image.height) // 2
          background.paste(image, (x, y))

          for name in (
              "icon-uns.png",
              "icon-sel.png",
              "icon-uns-dev.png",
              "icon-sel-dev.png",
          ):
              background.save(out_dir / name, "PNG")

          print(f"Prepared G3A icon from {source}: {size[0]}x{size[1]}")
          PY

      - name: Restore fxSDK toolchain cache
        id: cache-fxsdk
        uses: actions/cache/restore@v4
        with:
          path: ~/.local
          key: fxsdk-${{ runner.os }}-badbd0fd-09e2cf5f-ccb5feae-v1

      - name: Add local tools to PATH
        shell: bash
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install GiteaPC
        if: steps.cache-fxsdk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl "https://git.planet-casio.com/Lephenixnoir/GiteaPC/raw/branch/master/install.sh" \
            -o /tmp/giteapc-install.sh
          printf '\n' | bash /tmp/giteapc-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install fxSDK toolchain and libraries
        if: steps.cache-fxsdk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"

          # GNU mirrors occasionally return a tiny HTML error page while
          # GiteaPC expects an xz archive. After a failed attempt, validate and
          # pre-seed both GNU archives from the primary server before retrying.
          ensure_xz_archive() {
            local url="$1"
            local destination="$2"
            local temporary="${destination}.tmp"

            if xz -t "$destination" >/dev/null 2>&1; then
              return 0
            fi

            rm -f "$destination" "$temporary"
            mkdir -p "$(dirname "$destination")"
            curl --fail --location \
              --retry 5 --retry-delay 10 --retry-all-errors \
              --connect-timeout 30 "$url" -o "$temporary"
            xz -t "$temporary"
            mv "$temporary" "$destination"
          }

          install_with_retry() {
            local attempt
            local binutils_root="$HOME/.local/share/giteapc/Lephenixnoir/sh-elf-binutils"
            local gcc_root="$HOME/.local/share/giteapc/Lephenixnoir/sh-elf-gcc"

            for attempt in 1 2 3; do
              if printf '\n' | giteapc install "$@"; then
                return 0
              fi

              echo "GiteaPC attempt $attempt failed; repairing GNU archives"
              rm -rf "$binutils_root/binutils-2.42" "$gcc_root/gcc-14.1.0"
              ensure_xz_archive \
                "https://ftp.gnu.org/gnu/binutils/binutils-2.42.tar.xz" \
                "$binutils_root/binutils-2.42.tar.xz"
              ensure_xz_archive \
                "https://ftp.gnu.org/gnu/gcc/gcc-14.1.0/gcc-14.1.0.tar.xz" \
                "$gcc_root/gcc-14.1.0.tar.xz"
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 10))
              fi
            done
            return 1
          }

          install_with_retry \
            Lephenixnoir/fxsdk:noudisks2 \
            Lephenixnoir/sh-elf-binutils \
            Lephenixnoir/sh-elf-gcc
          install_with_retry Lephenixnoir/OpenLibm Vhex-Kernel-Core/fxlibc
          install_with_retry Lephenixnoir/sh-elf-gcc
          install_with_retry Lephenixnoir/gint

          # JustUI currently references font_t.line_distance, which was
          # removed from the current gint C font structure. Fetch JustUI
          # through GiteaPC, then patch the two affected references to the
          # current line_height member before rebuilding/installing it.
          set +e
          printf '\n' | giteapc install Lephenixnoir/JustUI
          justui_rc=$?
          set -e

          JUSTUI_DIR="$HOME/.local/share/giteapc/Lephenixnoir/JustUI"
          if [ "$justui_rc" -ne 0 ]; then
            test -f "$JUSTUI_DIR/src/jlabel.c"
            sed -i 's/->line_distance/->line_height/g' "$JUSTUI_DIR/src/jlabel.c"
            gmake -C "$JUSTUI_DIR" -f giteapc.make build
            gmake -C "$JUSTUI_DIR" -f giteapc.make install
          fi

      - name: Backport newer-display R61524 protocol
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"

          # Apply only upstream's verified one-file display change to the
          # known-good gint baseline. The patch selects the new 0x2a/0x2b/0x2c
          # protocol only for controller versions 50 and 82; all older
          # controllers retain the established R61524 update sequence.
          GINT_BASE=badbd0fd2bd8ac796fd55d49b93691741bd8a139
          GINT_DISPLAY_COMMIT=27000967d72d16f92ab54e7a10c7505ef85e2e85
          GINT_DIR="$(giteapc show -p Lephenixnoir/gint)"
          git -C "$GINT_DIR" restore --source="$GINT_BASE" --worktree --staged \
            src/r61524/r61524.c
          git -C "$GINT_DIR" checkout --detach "$GINT_BASE"
          git -C "$GINT_DIR" diff "$GINT_DISPLAY_COMMIT^" "$GINT_DISPLAY_COMMIT" \
            -- src/r61524/r61524.c > /tmp/gint-new-display.patch
          git -C "$GINT_DIR" apply --check /tmp/gint-new-display.patch
          git -C "$GINT_DIR" apply /tmp/gint-new-display.patch
          git -C "$GINT_DIR" diff --check
          grep -q 'version == 50 || version == 82' \
            "$GINT_DIR/src/r61524/r61524.c"
          (
            cd "$GINT_DIR"
            fxsdk build-cg
            fxsdk build-cg install
          )
          test "$(git -C "$GINT_DIR" rev-parse HEAD)" = "$GINT_BASE"

      - name: Save fxSDK toolchain cache
        if: steps.cache-fxsdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.local
          key: fxsdk-${{ runner.os }}-badbd0fd-09e2cf5f-ccb5feae-v1

      - name: Record dependency versions
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p build-info
          {
            echo "PythonExtra: $(git rev-parse HEAD)"
            echo "Upstream PythonExtra: $(cat UPSTREAM_COMMIT 2>/dev/null || echo unknown)"
            echo "gint: $(git -C "$(giteapc show -p Lephenixnoir/gint)" rev-parse HEAD)"
            echo "fxSDK: $(git -C "$(giteapc show -p Lephenixnoir/fxsdk)" rev-parse HEAD)"
            echo "JustUI: $(git -C "$(giteapc show -p Lephenixnoir/JustUI)" rev-parse HEAD)"
          } | tee build-info/versions.txt

      - name: Capture pinned gint display sources
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          GINT_DIR="$(giteapc show -p Lephenixnoir/gint)"
          git -C "$GINT_DIR" archive --format=tar.gz \
            --output="$GITHUB_WORKSPACE/build-info/gint-source.tar.gz" HEAD
          git -C "$GINT_DIR" log --all --date=iso --pretty=format:'%H %ad %s' \
            --regexp-ignore-case --grep='display\|r61524\|cg50\|fx-cg' \
            > build-info/gint-display-history.txt

          # Export the exact upstream newer-display changes for review before
          # changing the dependency revision used by the known-good build.
          for commit in \
            27000967d72d16f92ab54e7a10c7505ef85e2e85 \
            31f2506e3b94cd8332b97a519471017e52e374d6 \
            982055c999bdd0d73d23dad7c75ad5bd87b22922
          do
            git -C "$GINT_DIR" show --format=fuller --stat --patch "$commit" \
              > "$GITHUB_WORKSPACE/build-info/gint-$commit.patch"
          done

          {
            for older in \
              27000967d72d16f92ab54e7a10c7505ef85e2e85 \
              31f2506e3b94cd8332b97a519471017e52e374d6
            do
              if git -C "$GINT_DIR" merge-base --is-ancestor \
                "$older" 982055c999bdd0d73d23dad7c75ad5bd87b22922
              then
                echo "$older is an ancestor of 982055c999bdd0d73d23dad7c75ad5bd87b22922"
              else
                echo "$older is NOT an ancestor of 982055c999bdd0d73d23dad7c75ad5bd87b22922"
              fi
            done
          } > build-info/gint-compat-ancestry.txt

      - name: Build PythonExtra for fx-CG50
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          make -C ports/fxcg50 -j2

      - name: Smoke-check G3A and REPL surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          g3a = Path("ports/fxcg50/PythonExtra.g3a")
          data = g3a.read_bytes()

          if len(data) < 100_000:
              raise SystemExit(f"G3A is unexpectedly small: {len(data)} bytes")

          # Static smoke checks cannot replace calculator testing, but they do
          # catch stripped or mispackaged builds before publishing an artifact.
          required = {
              b"PythonExtra": "application identity",
              b"*** SHELL INITIALIZED ***": "interactive REPL",
              b"dtriangle": "native triangle binding",
              b"numpy": "compact numeric module",
              b"matmul": "matrix multiplication helper",
              b"normalize": "vector normalization helper",
              b"listdir": "calculator os filesystem module",
          }
          missing = [label for marker, label in required.items() if marker not in data]
          if missing:
              raise SystemExit("Missing G3A surfaces: " + ", ".join(missing))

          print(f"Validated {g3a}: {len(data)} bytes")
          for label in required.values():
              print(f"  present: {label}")
          PY

      - name: Upload G3A
        uses: actions/upload-artifact@v4
        with:
          name: PythonExtra-CG50
          path: |
            ports/fxcg50/PythonExtra.g3a
            build-info/
          if-no-files-found: error
