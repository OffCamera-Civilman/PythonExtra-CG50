name: Build UltraDex CG50

on:
  workflow_dispatch:
  push:
    branches:
      - cg50-new-display
    paths:
      - "ultradex/**"
      - ".github/workflows/build-ultradex.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git python3 python3-pil build-essential cmake pkg-config libusb-1.0-0-dev libsdl2-dev libpng-dev libncurses-dev

      - name: Restore fxSDK toolchain cache
        id: cache-fxsdk
        uses: actions/cache/restore@v4
        with:
          path: ~/.local
          key: fxsdk-${{ runner.os }}-badbd0fd-09e2cf5f-ccb5feae-v1

      - name: Add local tools to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify cached toolchain
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          command -v fxsdk
          command -v giteapc
          command -v sh-elf-gcc

      - name: Backport newer-display R61524 protocol
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          GINT_BASE=badbd0fd2bd8ac796fd55d49b93691741bd8a139
          GINT_DISPLAY_COMMIT=27000967d72d16f92ab54e7a10c7505ef85e2e85
          GINT_DIR="$(giteapc show -p Lephenixnoir/gint)"
          git -C "$GINT_DIR" restore --source="$GINT_BASE" --worktree --staged src/r61524/r61524.c || true
          git -C "$GINT_DIR" checkout --detach "$GINT_BASE"
          git -C "$GINT_DIR" diff "$GINT_DISPLAY_COMMIT^" "$GINT_DISPLAY_COMMIT" -- src/r61524/r61524.c > /tmp/gint-new-display.patch
          git -C "$GINT_DIR" apply --check /tmp/gint-new-display.patch
          git -C "$GINT_DIR" apply /tmp/gint-new-display.patch
          ( cd "$GINT_DIR"; fxsdk build-cg; fxsdk build-cg install )

      - name: Create fxSDK project
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          rm -rf /tmp/UltraDexBuild
          cd /tmp
          fxsdk new UltraDexBuild
          cp "$GITHUB_WORKSPACE/ultradex/main.c" UltraDexBuild/src/main.c

      - name: Build UltraDex
        working-directory: /tmp/UltraDexBuild
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          fxsdk build-cg
          G3A="$(find . -name '*.g3a' | head -n1)"
          test -n "$G3A"
          cp "$G3A" "$GITHUB_WORKSPACE/UltraDex-CG50.g3a"
          ls -lh "$GITHUB_WORKSPACE/UltraDex-CG50.g3a"

      - name: Upload UltraDex
        uses: actions/upload-artifact@v4
        with:
          name: UltraDex-CG50
          path: UltraDex-CG50.g3a
          if-no-files-found: error
