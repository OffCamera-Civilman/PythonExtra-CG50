name: Build UltraDex CG50

on:
  workflow_dispatch:
  push:
    branches:
      - cg50-new-display
    paths:
      - "ultradex/**"
      - ".github/workflows/build-ultradex.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             curl git python3 python3-pil build-essential cmake pkg-config             libusb-1.0-0-dev libsdl2-dev libpng-dev libncurses-dev             libmpfr-dev libmpc-dev libgmp-dev libisl-dev zlib1g-dev             flex bison texinfo libudev-dev libudisks2-dev libglib2.0-dev

      - name: Add local tools to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install GiteaPC directly from git
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          rm -rf /tmp/GiteaPC
          git clone --depth 1 https://git.planet-casio.com/Lephenixnoir/GiteaPC.git /tmp/GiteaPC
          make -C /tmp/GiteaPC install
          command -v giteapc
          giteapc --help >/dev/null

      - name: Install fxSDK toolchain and libraries
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"

          ensure_xz_archive() {
            local url="$1"
            local destination="$2"
            local temporary="${destination}.tmp"
            if xz -t "$destination" >/dev/null 2>&1; then return 0; fi
            rm -f "$destination" "$temporary"
            mkdir -p "$(dirname "$destination")"
            curl --fail --location --retry 5 --retry-delay 10 --retry-all-errors               --connect-timeout 30 "$url" -o "$temporary"
            xz -t "$temporary"
            mv "$temporary" "$destination"
          }

          install_with_retry() {
            local attempt
            local binutils_root="$HOME/.local/share/giteapc/Lephenixnoir/sh-elf-binutils"
            local gcc_root="$HOME/.local/share/giteapc/Lephenixnoir/sh-elf-gcc"
            for attempt in 1 2 3; do
              if printf '\n' | giteapc install "$@"; then return 0; fi
              echo "GiteaPC attempt $attempt failed; repairing GNU archives"
              rm -rf "$binutils_root/binutils-2.42" "$gcc_root/gcc-14.1.0"
              ensure_xz_archive "https://ftp.gnu.org/gnu/binutils/binutils-2.42.tar.xz"                 "$binutils_root/binutils-2.42.tar.xz"
              ensure_xz_archive "https://ftp.gnu.org/gnu/gcc/gcc-14.1.0/gcc-14.1.0.tar.xz"                 "$gcc_root/gcc-14.1.0.tar.xz"
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
            done
            return 1
          }

          install_with_retry             Lephenixnoir/fxsdk:noudisks2             Lephenixnoir/sh-elf-binutils             Lephenixnoir/sh-elf-gcc
          install_with_retry Lephenixnoir/OpenLibm Vhex-Kernel-Core/fxlibc
          install_with_retry Lephenixnoir/sh-elf-gcc
          install_with_retry Lephenixnoir/gint

          command -v fxsdk
          command -v sh-elf-gcc

      - name: Cache completed fxSDK toolchain
        uses: actions/cache/save@v4
        with:
          path: ~/.local
          key: fxsdk-${{ runner.os }}-ultradex-direct-v2

      - name: Create fxSDK project
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          rm -rf /tmp/UltraDexBuild
          cd /tmp
          fxsdk new UltraDexBuild
          cp "$GITHUB_WORKSPACE/ultradex/main.c" UltraDexBuild/src/main.c

      - name: Build UltraDex
        working-directory: /tmp/UltraDexBuild
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          fxsdk build-cg
          G3A="$(find . -name '*.g3a' | head -n1)"
          test -n "$G3A"
          cp "$G3A" "$GITHUB_WORKSPACE/UltraDex-CG50.g3a"
          ls -lh "$GITHUB_WORKSPACE/UltraDex-CG50.g3a"

      - name: Upload UltraDex
        uses: actions/upload-artifact@v4
        with:
          name: UltraDex-CG50
          path: UltraDex-CG50.g3a
          if-no-files-found: error
