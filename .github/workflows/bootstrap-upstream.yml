name: Bootstrap upstream PythonExtra

on:
  push:
    paths:
      - ".github/workflows/bootstrap-upstream.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import upstream PythonExtra
        shell: bash
        run: |
          set -euo pipefail

          if [ -d ports/fxcg50 ]; then
            echo "PythonExtra source already present; nothing to import."
            exit 0
          fi

          rm -rf /tmp/pythonextra-upstream
          git clone --depth 1 \
            https://git.planet-casio.com/Lephenixnoir/PythonExtra.git \
            /tmp/pythonextra-upstream

          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'README.md' \
            /tmp/pythonextra-upstream/ ./

          git -C /tmp/pythonextra-upstream rev-parse HEAD > UPSTREAM_COMMIT

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi

          git commit -m "Import upstream PythonExtra source [skip ci]"
          git push origin HEAD:main
